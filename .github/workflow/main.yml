name: TikTok View Booster

on:
  workflow_dispatch:  # يسمحلك تشغله يدوياً
  schedule:
    - cron: '0 */2 * * *' # يشتغل كل ساعتين أوتوماتيك

jobs:
  boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          pip install selenium webdriver-manager
          
      - name: Run View Bot
        run: python views_bot.py
